x-app: &app
  build: .
  image: localhost/dice-bot-app:local
  restart: unless-stopped

services:
  bot:
    <<: *app
    environment:
      TELEGRAM_TOKEN: ${TELEGRAM_TOKEN:-}
      TELEGRAM_TOKEN_FILE: /run/dice-secrets/token.txt
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
      WEB_DB_PATH: /var/lib/dice/rolls.sqlite3
    volumes:
      - ./secrets:/run/dice-secrets:ro,Z
      - rolls:/var/lib/dice

  web:
    <<: *app
    command: ["uvicorn", "web_app:create_app", "--factory", "--host", "0.0.0.0", "--port", "8000"]
    environment:
      WEB_ACCESS_CODE: ${WEB_ACCESS_CODE:?Set WEB_ACCESS_CODE in .env}
      WEB_ADMIN_CODE: ${WEB_ADMIN_CODE:-}
      WEB_SESSION_SECRET: ${WEB_SESSION_SECRET:?Set WEB_SESSION_SECRET in .env}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
      WEB_DB_PATH: /var/lib/dice/rolls.sqlite3
    volumes:
      - rolls:/var/lib/dice
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=3).close()"]
      interval: 10s
      timeout: 4s
      retries: 5
      start_period: 5s

volumes:
  rolls:
