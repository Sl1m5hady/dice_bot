server_tokens off;

map "$request_method:$uri" $dice_login_ip {
    default "";
    "POST:/api/session" $binary_remote_addr;
    "POST:/api/admin/session" $binary_remote_addr;
}

map "$request_method:$uri" $dice_chat_post_ip {
    default "";
    "POST:/api/chat" $binary_remote_addr;
}

limit_conn_zone $binary_remote_addr zone=dice_conn:10m;
limit_req_zone $binary_remote_addr zone=dice_global:10m rate=10r/s;
limit_req_zone $dice_login_ip zone=dice_login:1m rate=6r/m;
limit_req_zone $dice_chat_post_ip zone=dice_chat_post:5m rate=30r/m;
