client_max_body_size 512k;
client_body_timeout 10s;
client_header_timeout 10s;

add_header X-Robots-Tag "noindex, nofollow" always;

location = /robots.txt {
    default_type text/plain;
    return 200 "User-agent: *\nDisallow: /\n";
}

# Drop common automated vulnerability/CMS probes without hitting FastAPI.
location ~* (^/\.(?!well-known/)|\.php$|^/(wp-|xmlrpc\.php|cgi-bin|vendor|phpmyadmin|pma|adminer)) {
    return 444;
}

location / {
    limit_conn dice_conn 20;
    limit_conn_status 429;
    limit_req zone=dice_global burst=30 nodelay;
    limit_req zone=dice_login burst=4 nodelay;
    limit_req zone=dice_chat_post burst=10 nodelay;
    limit_req_status 429;
    set $dice_backend web:8000;
    proxy_pass http://$dice_backend$request_uri;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
}
