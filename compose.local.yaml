services:
  nginx:
    image: docker.io/library/nginx:stable-alpine
    restart: unless-stopped
    entrypoint: ["/bin/sh", "/opt/dice/nginx-start.sh"]
    depends_on:
      web:
        condition: service_started
        restart: true
    ports:
      - "127.0.0.1:8080:80"
    volumes:
      - ./deploy/nginx/start.sh:/opt/dice/nginx-start.sh:ro,Z
      - ./deploy/nginx/local.conf:/etc/nginx/conf.d/default.conf:ro,Z
      - ./deploy/nginx/access-rate.conf:/etc/nginx/conf.d/access-rate.conf:ro,Z
      - ./deploy/nginx/proxy.conf:/etc/nginx/snippets/dice-proxy.conf:ro,Z
